name: Research Team Platform

on:
  push:
    branches: [main, feat/firebase-backend-migration]
    paths:
      - "research-team-platform/**"
      - ".github/workflows/research-team-platform.yml"
  pull_request:
    paths:
      - "research-team-platform/**"
      - ".github/workflows/research-team-platform.yml"
  workflow_dispatch:

concurrency:
  group: research-team-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: research-team-platform

jobs:
  checks:
    name: Lint, types, unit, migration, Firebase Rules and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: local-ci-placeholder-not-a-secret
      FIREBASE_PROJECT_ID: demo-research-team-platform
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research-team-platform/package-lock.json
      - name: Install scheduled function dependencies
        run: npm ci --prefix functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm --prefix functions run lint
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migration
      - run: npm run test:firebase
      - run: npm run build
