name: NestHire Supabase Production Migration

# Applies committed migrations from protected `main` to the NestHire Supabase
# project (jkvxhxrclfvoxqcniyck). Never resets, never seeds, never repairs the
# migration history: anything unexpected stops the run for a human to review.
#
# Usage (Actions -> this workflow -> Run workflow, branch: main):
#   1. mode = dry-run                      -> shows the pending migrations only.
#   2. mode = apply, confirm_project_ref = jkvxhxrclfvoxqcniyck
#                                          -> re-checks the plan, then applies it.
#
# Owner configuration (Settings -> Environments -> nesthire-production):
#   * required reviewers, and "Deployment branches: main" only;
#   * store SUPABASE_DB_URL as an *environment* secret there (Session Pooler
#     URL, port 5432, user postgres.jkvxhxrclfvoxqcniyck) and delete any
#     repository-level copy, so only these gated jobs can read it.
# See research-team-platform/docs/DATABASE_READINESS.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows pending migrations; apply also applies them"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_project_ref:
        description: "For apply: type the project ref jkvxhxrclfvoxqcniyck"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: nesthire-supabase-production-migration
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: jkvxhxrclfvoxqcniyck
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  plan:
    name: Validate and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nesthire-production
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pending_sha256: ${{ steps.dryrun.outputs.pending_sha256 }}
    defaults:
      run:
        working-directory: research-team-platform
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require protected main
        working-directory: .
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Migrations can only be applied from refs/heads/main (got: $REF)" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        name: Record the exact source commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate SUPABASE_DB_URL without revealing it
        run: node scripts/ci/validate-supabase-db-url.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Repository migrations
        run: find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
      - name: Remote migration ledger
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - id: dryrun
        name: Dry-run (no changes)
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          grep -oE '[0-9]{14}_[a-z0-9_]+\.sql' "$RUNNER_TEMP/dry-run.txt" | sort -u > "$RUNNER_TEMP/pending.txt" || true
          echo "Pending migrations:"; cat "$RUNNER_TEMP/pending.txt"
          echo "pending_sha256=$(sha256sum "$RUNNER_TEMP/pending.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply migrations
    needs: plan
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nesthire-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: research-team-platform
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require explicit confirmation and protected main
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm_project_ref }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Apply is only allowed from refs/heads/main" >&2; exit 1
          fi
          if [ "$CONFIRM" != "$EXPECTED_PROJECT_REF" ]; then
            echo "confirm_project_ref must equal the expected project ref" >&2; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate SUPABASE_DB_URL without revealing it
        run: node scripts/ci/validate-supabase-db-url.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Re-check that the pending set still matches the reviewed dry-run
        env:
          EXPECTED_PENDING_SHA256: ${{ needs.plan.outputs.pending_sha256 }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          grep -oE '[0-9]{14}_[a-z0-9_]+\.sql' "$RUNNER_TEMP/dry-run.txt" | sort -u > "$RUNNER_TEMP/pending.txt" || true
          if [ ! -s "$RUNNER_TEMP/pending.txt" ]; then
            echo "Nothing to apply."; exit 0
          fi
          actual="$(sha256sum "$RUNNER_TEMP/pending.txt" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_PENDING_SHA256" ]; then
            echo "Pending migrations changed since the dry-run; re-run the plan." >&2; exit 1
          fi
      - name: Apply migrations (no reset, no seed, no history repair)
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Verify migration ledger
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
