<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f5f4;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:#1c1917">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr>
        <td>
          <h1 style="font-size:20px;margin:0 0 12px">Confirm your new e-mail</h1>
          <p style="font-size:14px;line-height:1.6;margin:0 0 20px">Confirm that you want to use this address for your account.</p>
          <p style="margin:0 0 28px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings" style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px">Confirm new e-mail</a>
          </p>
          <hr style="border:none;border-top:1px solid #e7e5e4;margin:0 0 24px" />
          <div dir="rtl" style="text-align:right">
            <h1 style="font-size:20px;margin:0 0 12px">تأكيد البريد الجديد</h1>
            <p style="font-size:14px;line-height:1.8;margin:0 0 20px">يرجى تأكيد رغبتك في استخدام هذا العنوان لحسابك.</p>
            <p style="margin:0">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings" style="display:inline-block;background:#1c1917;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px">تأكيد البريد الجديد</a>
            </p>
          </div>
          <p style="font-size:12px;color:#78716c;margin:28px 0 0">If you did not request this e-mail you can ignore it. · إذا لم تطلب هذه الرسالة يمكنك تجاهلها.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
