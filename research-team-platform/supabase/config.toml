# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the Supabase dashboard instead; see README.

project_id = "nesthire-workspace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Demo data is created with `npm run seed` (acts through the real API as each
# demo user so the activity log is authentic).
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.email.template.confirmation]
subject = "Confirm your account | تأكيد الحساب"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password | إعادة تعيين كلمة المرور"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You have been invited to NestHire Workspace | دعوة للانضمام إلى مساحة عمل NestHire"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new e-mail | تأكيد البريد الإلكتروني الجديد"
content_path = "./supabase/templates/email_change.html"
